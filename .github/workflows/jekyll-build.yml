name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main  # your default branch
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Ruby (use v1 to avoid v2 resolution issues)
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        gem install jekyll bundler
        bundle install

    # 4. Build the Jekyll site
    - name: Build site
      run: bundle exec jekyll build

    # 5. Upload build artifact (use v4 to avoid v3 deprecation)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: _site

    # 6. Deploy to GitHub Pages (peaceiris/actions-gh-pages v6)
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site